events {
  worker_connections 1024;
}

http {
  server_tokens off;
  client_max_body_size 150k;

  upstream aevo_api_cluster {
    least_conn;
    server api-1:3001 max_fails=3 fail_timeout=10s;
    server api-2:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 3001;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy REST API & Healthcheck across stateless API replicas
    location / {
      proxy_pass http://aevo_api_cluster;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
