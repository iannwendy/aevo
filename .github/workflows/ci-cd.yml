name: AEVO E-Commerce CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: aevo
  JWT_SECRET: aevo-ci-secret-key-2026

jobs:
  # ============================================================================
  # STAGE 1: Code Quality, Schema Validation & Academic Compliance Check
  # ============================================================================
  lint-and-validate:
    name: Validate Schema & Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root and workspace dependencies
        run: |
          npm install
          cd apps/api && npm install
          cd ../web && npm install

      - name: Verify JavaScript-only compliance (No TypeScript source files)
        run: |
          TS_FILES=$(find apps -type f \( -name "*.ts" -o -name "*.tsx" \) -not -path "*/node_modules/*" -not -path "*/.next/*" || true)
          if [ -n "$TS_FILES" ]; then
            echo "Disallowed TypeScript files detected:"
            echo "$TS_FILES"
            exit 1
          fi
          echo "Verified: 100% JavaScript (.js / .jsx) codebase."

      - name: Validate Prisma Schema & Generate Client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aevo
        run: |
          npx prisma validate
          npx prisma generate

      - name: Validate Docker Compose Configurations
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.scale.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.microservices.yml config -q

  # ============================================================================
  # STAGE 2: Build Verification & Automated End-to-End Testing (Run on PR & Push)
  # ============================================================================
  test-and-verify:
    name: Build & Run E2E Test Suites
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aevo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aevo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aevo
      REDIS_URL: redis://localhost:6379
      ELASTICSEARCH_URL: http://localhost:9200
      PORT: '3001'
      CLIENT_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          cd apps/api && npm install
          cd ../web && npm install

      - name: Push Prisma schema & seed database
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed

      - name: Build Next.js Frontend & Verify Backend Syntax
        run: |
          npm run build --workspace=apps/web
          npm run build --workspace=apps/api

      - name: Install Playwright Chromium for E2E Browser Tests
        run: npx playwright install --with-deps chromium

      - name: Start Microservices, Elasticsearch, API & Web Servers
        run: |
          SERVICE_ROLE=elasticsearch PORT=9200 node apps/api/src/microservices/service-runner.js &
          SERVICE_ROLE=product-service PORT=3002 node apps/api/src/microservices/service-runner.js &
          SERVICE_ROLE=order-service PORT=3003 node apps/api/src/microservices/service-runner.js &
          SERVICE_ROLE=user-service PORT=3004 node apps/api/src/microservices/service-runner.js &
          npm run start --workspace=apps/api &
          npm run start --workspace=apps/web &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null && curl -sf http://localhost:3000 > /dev/null; then
              echo "Both API (3001) and Web (3000) servers are healthy!"
              break
            fi
            sleep 1
          done

      - name: Run Automated E2E Test Suites (Phases 1 - 6 & Security)
        run: |
          node apps/api/test/phase1.e2e.js
          node apps/api/test/phase2.e2e.js
          node apps/api/test/phase3.e2e.js
          node apps/api/test/phase4.e2e.js
          node apps/api/test/security.e2e.js
          node apps/api/test/phase6.e2e.js

  # ============================================================================
  # STAGE 3: Docker Container Image Build Verification
  # ============================================================================
  docker-build:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API and Web Docker Images
        run: |
          docker compose build api web

  # ============================================================================
  # STAGE 4: Automated Deployment on Merge to Main
  # ============================================================================
  deploy:
    name: Auto Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-validate, test-and-verify, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Production Deployment Rollout
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Deploying AEVO commit ${{ github.sha }} to production..."
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"commit\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\"}"
          else
            echo "Production artifacts verified. Ready for Docker Compose / Cloud deployment."
          fi
