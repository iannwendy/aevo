services:
  # Frontend - Next.js 14 Storefront & Admin Control Panel
  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - INTERNAL_API_URL=http://api:3001
      - JWT_SECRET=${JWT_SECRET:-aevo-dev-secret-key-change-in-production}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/icon.svg >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aevo-network

  # API Gateway & Core Backend - Stateless Express.js REST API + Socket.IO Server
  api:
    image: aevo-api:latest
    build:
      context: ./apps/api
      dockerfile: ../../docker/Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - SERVICE_ROLE=api-gateway
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aevo
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - USER_SERVICE_URL=http://user-service:3004
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6JUyM8clSYfyJEH5zWnnTgwjluDR-1xZLIcwZOooAwCkA}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - JWT_SECRET=${JWT_SECRET:-aevo-dev-secret-key-change-in-production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - API_URL=${API_URL:-http://localhost:3001}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-699562916647-lhh1cqbt00qmu2qf44qr8kcdeitkmslb.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-baominh.internship@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-ewscrhryhmsndyxi}
      - SMTP_FROM=${SMTP_FROM:-AEVO Store <baominh.internship@gmail.com>}
      - PORT=3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - aevo-network

  # Microservice 1: Product, Catalog & Search Synchronization Service
  product-service:
    image: aevo-api:latest
    pull_policy: never
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - SERVICE_ROLE=product-service
      - INSTANCE_ID=product-service-1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aevo
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET:-aevo-dev-secret-key-change-in-production}
      - PORT=3002
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aevo-network

  # Microservice 2: Order, Checkout & Async Notification Service
  order-service:
    image: aevo-api:latest
    pull_policy: never
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - SERVICE_ROLE=order-service
      - INSTANCE_ID=order-service-1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aevo
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-aevo-dev-secret-key-change-in-production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-baominh.internship@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-ewscrhryhmsndyxi}
      - SMTP_FROM=${SMTP_FROM:-AEVO Store <baominh.internship@gmail.com>}
      - PORT=3003
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aevo-network

  # Microservice 3: User Identity, Profile & Loyalty Ledger Service
  user-service:
    image: aevo-api:latest
    pull_policy: never
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - SERVICE_ROLE=user-service
      - INSTANCE_ID=user-service-1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aevo
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-aevo-dev-secret-key-change-in-production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-baominh.internship@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-ewscrhryhmsndyxi}
      - SMTP_FROM=${SMTP_FROM:-AEVO Store <baominh.internship@gmail.com>}
      - PORT=3004
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aevo-network

  # Elasticsearch Search Engine Node (Inverted-Index BM25 + Fuzzy Search)
  elasticsearch:
    image: aevo-api:latest
    pull_policy: never
    ports:
      - "9200:9200"
    environment:
      - NODE_ENV=production
      - SERVICE_ROLE=elasticsearch
      - INSTANCE_ID=es-node-1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aevo
      - REDIS_URL=redis://redis:6379
      - PORT=9200
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9200/_cluster/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aevo-network

  # PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aevo
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aevo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aevo-network

  # Redis 7 for Stateless Sessions, Rate Limiting, Async Microservice Event Bus & Socket.IO Pub/Sub
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - aevo-network

volumes:
  postgres_data:
  redis_data:

networks:
  aevo-network:
    driver: bridge
